name: astrbot_plugin_dafeiyu_faces
display_name: 随机颜文字
desc: 治"只会一张脸"：LLM 回复里的颜文字同款连用（该会话最近 N 条内出现过）就自动从同情绪池随机换一张——模型管配脸的时机和情绪，库管多样性。只认库内精确匹配的脸（不误伤（）动作描写），不认识的脸放行，任何异常放行原消息（fail-open）。只处理模型生成文本，指令/工具消息不动；换脸在分段发送之前完成。情绪池分包可选（基础/亲密/18+/雌小鬼，faces_packs 勾选），默认只开基础+亲密，成年向的 18+/雌小鬼包按需自行开启；池内颜文字取自主流颜文字站（kaomojis.jp/toolneko/lddgo 等）软款审美，非 2ch 硬核款；长脸内嵌短脸只处理最长的防劈坏；面板可编辑池（"池名=脸|脸|脸"），连用窗口可配（0=每张都随机发牌）。被动换脸不需要改人设、不需要模型配合。
short_desc: 同款颜文字连用就换：模型管时机情绪，情绪池管多样性，包可选/池可编辑/fail-open不吞消息
